<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - Karacs Hírlap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">   
</head>
<body class="body">

    <!-- Navigáció -->
    <nav class="navbar navbar-expand-lg navbar-dark slider sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📰 Karacs Hírlap</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menü megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Főoldal</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#esemenyek">Események</a></li>
                    <li class="nav-item"><a class="nav-link active" href="galeria.html">Galéria</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-3 my-md-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 base shadow-sm rounded p-3 p-md-4">
                <h1 class="h3 fw-bold mb-1">📁 Fotóalbumok</h1>
                <p class="text-muted mb-4">Kattints egy mappára a képek megtekintéséhez!</p>
                <div class="row g-3">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm overflow-hidden">
                            <button class="btn mappa-btn text-start p-3 d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#mappaTeahaz" aria-expanded="false">
                                <span class="fw-bold fs-5">Teaház Mappa</span>
                                <span class="badge bg-dark rounded-pill">Kattints a megnyitáshoz</span>
                            </button>
                            <div class="collapse p-3 bg-light border-top" id="mappaTeahaz">
                                <div class="row g-2">
                                    <div class="col-6 col-md-4">
                                        <img src="img/golyaavato2.png" class="img-fluid rounded galeria-img shadow-sm" alt="Teaház 1" data-bs-toggle="modal" data-bs-target="#imgModal1">
                                    </div>
                                    <div class="col-6 col-md-4">
                                        <img src="img/dok.png" class="img-fluid rounded galeria-img shadow-sm" alt="Teaház 2" data-bs-toggle="modal" data-bs-target="#imgModal2">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card border-0 shadow-sm overflow-hidden">
                            <button class="btn mappa-btn text-start p-3 d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#mappaGolyaavato" aria-expanded="false">
                                <span class="fw-bold fs-5">Gólyaavató Mappa</span>
                                <span class="badge bg-dark rounded-pill">Kattints a megnyitáshoz</span>
                            </button>
                            <div class="collapse p-3 bg-light border-top" id="mappaGolyaavato">
                                <div class="row g-2">
                                    <div class="col-6 col-md-4">
                                        <img src="img/golyaavato2.png" class="img-fluid rounded galeria-img shadow-sm" alt="Gólyaavató 1" data-bs-toggle="modal" data-bs-target="#imgModal1">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card border-0 shadow-sm overflow-hidden">
                            <button class="btn mappa-btn text-start p-3 d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#mappaDok" aria-expanded="false">
                                <span class="fw-bold fs-5">DÖK Események</span>
                                <span class="badge bg-dark rounded-pill">Kattints a megnyitáshoz</span>
                            </button>
                            <div class="collapse p-3 bg-light border-top" id="mappaDok">
                                <div class="row g-2">
                                    <div class="col-6 col-md-4">
                                        <img src="img/dok.png" class="img-fluid rounded galeria-img shadow-sm" alt="DÖK 1" data-bs-toggle="modal" data-bs-target="#imgModal2">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <div class="modal fade" id="imgModal1" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center p-0">
                    <img src="img/golyaavato2.png" class="img-fluid rounded shadow" alt="Kép 1">
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="imgModal2" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center p-0">
                    <img src="img/dok.png" class="img-fluid rounded shadow" alt="Kép 2">
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
